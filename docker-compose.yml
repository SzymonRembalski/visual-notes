name: visual-notes-dev
services:
  visual-notes-dev:
    build: .
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: sh -c "node server/db/migrate.mjs && node server/index.mjs"
    stop_grace_period: 20s
    env_file:
      - ${VISUAL_NOTES_ENV_FILE:?Set VISUAL_NOTES_ENV_FILE to the private test-server env file}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - npm_network

networks:
  npm_network:
    external: true
    name: nginx-proxy-manager_default
