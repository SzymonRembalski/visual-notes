name: Deploy main to Portainer

on:
  push:
    branches:
      - main

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Portainer redeploy
        run: |
          curl -v -f -X PUT \
            "https://portainer.rafalcaban.com/api/stacks/12/git/redeploy?endpointId=3" \
            -H "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}" \
            -H "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}" \
            -H "X-API-Key: ${{ secrets.PORTAINER_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"RepullImageAndRedeploy": true}'
      - name: Debug secret lengths
        run: |
          echo "Client ID length: ${#CF_ID}"
          echo "Client Secret length: ${#CF_SECRET}"
        env:
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
