<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="task-page">
    <h1>Task Tracker</h1>
    <div id="controls">
        <button onclick="addTask()">+ New Task</button>
        <button onclick="addCategory()">+ Category</button>
        <a href="index.html" class="button button-link" data-backup-before-leave>Back to Menu</a>
    </div>
    <table>
        <thead>
            <tr>
                <th></th>
                <th>Task</th>
                <th>Steps</th>
                <th>Progress</th>
                <th>%</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
    <script src="assets/js/local-backup-manager.js"></script>
    <script src="assets/js/task-tracker.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
