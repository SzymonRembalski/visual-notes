<!DOCTYPE html>
<html lang="en" class="canvas-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Notes</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <script src="assets/js/app-settings.js"></script>
</head>
<body class="canvas-page">
    <div id="toolbar">
        <a href="projects.html" class="workspaceBrand" aria-label="Back to Projects" data-backup-before-leave>
            <!-- Lucide waypoints; license in assets/lucide-LICENSE.txt. -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m10.586 5.414-5.172 5.172m13.172 2.828-5.172 5.172M6 12h12"/>
                <circle cx="12" cy="20" r="2"/><circle cx="12" cy="4" r="2"/><circle cx="20" cy="12" r="2"/><circle cx="4" cy="12" r="2"/>
            </svg>
        </a>
        <div class="workspaceIdentity">
            <div class="workspaceBreadcrumb"><a href="index.html" data-backup-before-leave>Visual Notes</a><span>/</span><a href="projects.html" data-backup-before-leave>Projects</a></div>
            <input id="projectTitleInput" class="projectTitleInput" type="text" aria-label="Project title" placeholder="Project title" title="Click to edit project title" oninput="updateProjectTitle(this.value)">
        </div>
        <nav class="toolbarMenus" aria-label="Canvas menus">
            <details id="editMenu" class="toolbarMenu">
                <summary class="toolbarMenuTrigger">Edit</summary>
                <div class="toolbarMenuPanel editMenuPanel" aria-label="Editing tools">
                    <button type="button" onclick="createNote()" data-close-menu>New Node</button>
                    <button type="button" id="addBtn" onclick="toggleAddMode()" data-close-menu>Add Connections</button>
                    <button type="button" id="removeBtn" onclick="toggleRemoveMode()" data-close-menu>Remove Connections</button>
                    <button type="button" id="colorBtn" onclick="toggleColorMode()" data-close-menu>Color Mode</button>
                    <button type="button" id="shapesBtn" aria-pressed="false" onclick="toggleShapesMode()" title="Turn on Shapes mode, then drag on empty canvas to draw a rectangle" data-close-menu>Shapes Mode</button>
                    <button type="button" id="snapBtn" class="active" aria-pressed="true" onclick="toggleSnappingMode()" title="Align moved and resized items to canvas dots" data-close-menu>Snap: ON</button>
                </div>
            </details>
            <details id="saveMenu" class="toolbarMenu">
                <summary class="toolbarMenuTrigger backupToggle">Save</summary>
                <div id="saveMenuPanel" class="toolbarMenuPanel saveMenuPanel" aria-label="Save and backup options"></div>
            </details>
            <details id="exportMenu" class="toolbarMenu">
                <summary class="toolbarMenuTrigger">Export</summary>
                <div class="toolbarMenuPanel exportMenuPanel" aria-label="Export options">
                    <button id="exportImageBtn" class="exportImageButton" type="button" onclick="exportBoardImage()" data-close-menu>Export PNG</button>
                </div>
            </details>
        </nav>
        <button type="button" class="workspaceIconButton" id="appearanceToggle" aria-label="Switch to Paper appearance" title="Switch appearance"></button>
        <a href="settings.html" class="button button-link toolbarSettings" data-settings-link data-backup-before-leave>Settings</a>
        <span id="workspaceSaveStatus" class="workspaceSaveStatus" role="status" data-saved="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m20 6-11 11-5-5"/></svg>
            <span id="workspaceSaveLabel">Local workspace</span>
        </span>
    </div>
    <div id="grid" aria-hidden="true"></div>
    <div id="shapes" aria-label="Canvas groups" aria-hidden="true"></div>
    <svg id="connections"></svg>
    <div id="canvas"></div>
    <nav id="quickTools" class="workspaceControls quickTools" aria-label="Quick tools"></nav>
    <p id="workspaceHint" class="workspaceHint">Right-drag to pan <span>·</span> Scroll to zoom</p>
    <div class="workspaceControls zoomControls" aria-label="Canvas view">
        <button type="button" id="zoomOut" aria-label="Zoom out" title="Zoom out">−</button>
        <output id="zoomLevel" aria-label="Zoom level">100%</output>
        <button type="button" id="zoomIn" aria-label="Zoom in" title="Zoom in">+</button>
        <button type="button" id="centerView" aria-label="Center selection or board" title="Center selection or board"></button>
    </div>
    <div id="horizontalNavigator" class="canvasNavigator horizontalNavigator" role="scrollbar" aria-label="Horizontal canvas position" aria-orientation="horizontal" hidden>
        <div class="canvasNavigatorThumb"></div>
    </div>
    <div id="verticalNavigator" class="canvasNavigator verticalNavigator" role="scrollbar" aria-label="Vertical canvas position" aria-orientation="vertical" hidden>
        <div class="canvasNavigatorThumb"></div>
    </div>
    <script src="assets/js/local-backup-manager.js"></script>
    <script src="assets/js/project-manager.js"></script>
    <script src="assets/js/canvas-utils.js"></script>
    <script src="assets/js/board-image-exporter.js"></script>
    <script src="assets/js/history-manager.js"></script>
    <script src="assets/js/workspace-ui.js"></script>
    <script src="assets/js/visual-notes.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
