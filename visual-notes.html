<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Notes</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="canvas-page">
    <div id="toolbar">
        <input id="projectTitleInput" class="projectTitleInput" type="text" placeholder="Project title" oninput="updateProjectTitle(this.value)">
        <button onclick="createNote()">New Note</button>
        <button id="removeBtn" onclick="toggleRemoveMode()">Remove Connections</button>
        <button id="addBtn" onclick="toggleAddMode()">Add Connections</button>
        <button id="colorBtn" onclick="toggleColorMode()">Color Mode</button>
        <button id="shapesBtn" aria-pressed="false" onclick="toggleShapesMode()" title="Turn on Shapes mode, then drag on empty canvas to draw a rectangle">Shapes Mode</button>
        <a href="projects.html" class="button button-link" data-backup-before-leave>Back to Projects</a>
    </div>
    <div id="grid" aria-hidden="true"></div>
    <div id="shapes" aria-label="Canvas groups" aria-hidden="true"></div>
    <svg id="connections"></svg>
    <div id="canvas"></div>
    <script src="assets/js/local-backup-manager.js"></script>
    <script src="assets/js/project-manager.js"></script>
    <script src="assets/js/canvas-utils.js"></script>
    <script src="assets/js/history-manager.js"></script>
    <script src="assets/js/visual-notes.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
